<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#223449">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/brand/icon512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oncoway">
<title>Redefinir senha</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F1F3EE; --card:#FFFFFF; --ink:#1E2A32; --ink-soft:#4B5A61; --navy:#223449; --sage:#5C8374; --sage-dark:#3F5C50; --alert:#B33F2E; --line:#CBD3C4; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; }
  .card{ background:var(--card); border:1px solid var(--line); border-top:3px solid var(--sage); border-radius:4px; padding:32px; width:100%; max-width:380px; }
  h1{ font-family:'Source Serif 4',serif; font-size:22px; color:var(--navy); margin:0 0 18px; text-align:center; }
  label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); }
  input{ width:100%; font-size:14.5px; padding:10px 12px; border:1px solid var(--line); border-radius:3px; margin:6px 0 16px; font-family:inherit; }
  button{ width:100%; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.5px; text-transform:uppercase; background:var(--sage-dark); color:#fff; border:none; border-radius:3px; padding:12px; cursor:pointer; }
  button:hover{ background:var(--navy); }
  .error{ color:var(--alert); font-size:12.5px; margin-top:12px; text-align:center; min-height:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Criar nova senha</h1>
    <form onsubmit="return doReset(event)">
      <label for="pw1">Nova senha (mínimo 8 caracteres)</label>
      <input id="pw1" type="password" autocomplete="new-password" required minlength="8">
      <label for="pw2">Repita a senha</label>
      <input id="pw2" type="password" autocomplete="new-password" required minlength="8">
      <button type="submit">Salvar e entrar</button>
      <div class="error" id="err"></div>
    </form>
  </div>
<script>
(async function(){
  try{
    const r = await fetch('/api/branding'); if(!r.ok) return; const b = await r.json();
    const dk = (h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*(1-f)).toString(16).padStart(2,'0')).join('');};
    const root = document.documentElement.style;
    if(b.primaryColor) root.setProperty('--navy', b.primaryColor);
    if(b.accentColor){ root.setProperty('--sage', b.accentColor); root.setProperty('--sage-dark', dk(b.accentColor,0.25)); }
    document.title = 'Redefinir senha — ' + b.appName;
  }catch(e){}
})();
async function doReset(e){
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
  if(p1 !== p2){ err.textContent = 'As senhas não são iguais.'; return false; }
  const token = new URLSearchParams(location.search).get('token') || '';
  try{
    const res = await fetch('/api/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, password: p1 }) });
    const data = await res.json().catch(()=>({}));
    if(res.ok) window.location.href = '/';
    else err.textContent = data.error || 'Não foi possível redefinir.';
  }catch(x){ err.textContent = 'Erro de conexão. Tente novamente.'; }
  return false;
}
</script>
</body>
</html>
